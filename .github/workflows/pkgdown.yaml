# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., any::readxl, any::here, any::janitor, any::tidyr, any::ggplot2
          needs: website

      - name: Instalar dependencias para chilemapas
        run: sudo apt install libv8-dev libudunits2-dev libprotobuf-dev protobuf-compiler libgeos-dev libgdal-dev

      - name: Instalar pak
        run: Rscript -e 'install.packages("pak", repos = "http://cran.us.r-project.org")'

      - name: Instalar chilemapas
        run: Rscript -e 'pak::pak("pachadotdev/chilemapas")'

      - name: Set locale to Spanish
        run: |
          sudo locale-gen es_ES.UTF-8
          sudo update-locale LANG=es_ES.UTF-8
        shell: bash

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = TRUE, quiet = FALSE)
        shell: Rscript {0}
        env:
          LANG: es_ES.UTF-8

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: docs
