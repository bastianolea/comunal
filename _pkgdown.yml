url: https://bastianolea.github.io/territorial/
lang: es
template:
  bootstrap: 5
  theme: ayu-light
  bslib:
    fg: "#5c534a"
    bg: "#f9f1e5"
    navbar-bg: "#E1B280"
    primary: "#7CB096"
project:
  render: ['*.qmd']

authors:
  "Bastián Olea Herrera":
    href: "https://bastianolea.rbind.io"

home:
  links:
  - text: Blog sobre análisis de datos con R
    href: https://bastianolea.rbind.io/blog
  - text: Aprende a programar en R
    href: https://bastianolea.github.io/aprende_r/

reference:
- title: Datos territoriales
  desc:  Funciones y tablas de datos que entregan datos de uso territorial
  contents:
  - territorios
  - comunas
  - regiones
  - clasificacion
  - contextualizar
  - localidades
  - poblacion_proyeccion
- title: Evaluación de unidades territoriales
  desc: Funciones que permiten probar la calidad de los datos, o pueden ser usados para lógica condicional
  contents:
  - starts_with("is_")
  - starts_with("validar")
  - starts_with("buscar")
- title: Limpieza y corrección de territorios
  desc: Funciones para transformar datos de identificación de territorios, ordenarlos, etc.
  contents:
  - starts_with("as_")
  - starts_with("ordenar_")
  - starts_with("ubicar_")
  - starts_with("limpiar_")
- title: Complementar nombres de territorios
  desc: Funciones que toman los nombres de territorios y hacen más cosas con ellos
  contents:
  - preposicion_region
  - starts_with("redactar_")
  - starts_with("abreviar_")
  - starts_with("acortar_")
- title: Complementar datos territoriales
  desc: Funciones para agregar nuevas variables a partir de datos territoriales existentes
  contents:
  - starts_with("agregar_")

articles:
- title: Viñetas
  navbar: ~
  desc: Información general sobre el paquete
  contents:
  - territorial
  - localidades
  - codigos_unicos_territoriales
- title: Tutoriales
  navbar: Tutoriales
  desc: Guías explicativas para usar el paquete
  contents:
  - articles/mapas_comunales
  - articles/mapas_regionales_macrozonas
- title: Ejemplos
  navbar: Ejemplos
  desc: Casos de uso del paquete con datos reales
  contents:
  - articles/ejemplo_servel
  - articles/ejemplo_bibliotecas
  - articles/ejemplo_sercotec
